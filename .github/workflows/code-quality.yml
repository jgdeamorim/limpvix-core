name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  phpcs:
    name: PHP Code Sniffer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, xml, ctype, json

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install PHPCS
        run: composer require --dev squizlabs/php_codesniffer --no-interaction

      - name: Run PHPCS
        run: ./vendor/bin/phpcs --standard=PSR12 --extensions=php src/
        continue-on-error: true

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, xml, ctype, json

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install PHPStan
        run: composer require --dev phpstan/phpstan --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse src/ --level=5
        continue-on-error: true

  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Check PHP syntax
        run: find src/ -name "*.php" -print0 | xargs -0 -n1 php -l

  composer-validate:
    name: Validate Composer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Validate composer.json
        run: composer validate --strict

  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run security audit
        run: composer audit
        continue-on-error: true

  check-todos:
    name: Check for TODOs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments in source code..."
          TODO_COUNT=$(grep -r "TODO" src/ --include="*.php" | wc -l || true)
          echo "Found $TODO_COUNT TODO comments"

          if [ $TODO_COUNT -gt 0 ]; then
            echo "⚠️ TODO comments found:"
            grep -rn "TODO" src/ --include="*.php" || true
          else
            echo "✅ No TODO comments found"
          fi
        continue-on-error: true

  check-documentation:
    name: Check Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for missing PHPDoc
        run: |
          echo "Checking for missing PHPDoc comments..."

          # Check for public methods without PHPDoc
          MISSING_DOCS=$(find src/ -name "*.php" -exec grep -L "@param\|@return" {} \; | wc -l || true)

          echo "Files potentially missing documentation: $MISSING_DOCS"

          if [ $MISSING_DOCS -gt 50 ]; then
            echo "⚠️ Many files may be missing documentation"
          else
            echo "✅ Documentation coverage looks good"
          fi
        continue-on-error: true

  code-quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [phpcs, phpstan, php-syntax, composer-validate, composer-audit]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "PHPCS: ${{ needs.phpcs.result }}"
          echo "PHPStan: ${{ needs.phpstan.result }}"
          echo "PHP Syntax: ${{ needs.php-syntax.result }}"
          echo "Composer Validate: ${{ needs.composer-validate.result }}"
          echo "Composer Audit: ${{ needs.composer-audit.result }}"

          if [[ "${{ needs.php-syntax.result }}" != "success" ]] || \
             [[ "${{ needs.composer-validate.result }}" != "success" ]]; then
            echo "❌ Critical quality checks failed!"
            exit 1
          else
            echo "✅ Code quality checks passed!"
          fi
